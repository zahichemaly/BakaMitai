# Detekt config for BakaMitai.
# Applied on top of Detekt's default config (buildUponDefaultConfig = true), plus the defaults shipped by the
# ktlint wrapper and Compose rules plugins. Only list overrides here. Rules: best-practices skill, section 2.

naming:
  FunctionNaming:
    # Composables are PascalCase by convention.
    ignoreAnnotated: ['Composable']

complexity:
  LongParameterList:
    # Composables expose optional styling parameters (modifier, colors, ...) with defaults.
    ignoreDefaultParameters: true

style:
  ForbiddenImport:
    # Text goes through UiText; resources are named through common/ui/resource/ResourceTypes.kt (conventions §2.5).
    active: true
    forbiddenImports:
      - value: 'com.zc.bakamitai.R'
        reason: 'Use StringResource / FontResource from common/ui/resource/ResourceTypes.kt.'
      - value: 'androidx.compose.ui.res.stringResource'
        reason: 'Use UiText.StringResource(...).asString(); only UiText.kt resolves strings.'
      - value: 'androidx.compose.ui.res.pluralStringResource'
        reason: 'Use UiText.StringPlural(...).asString(); only UiText.kt resolves plurals.'
  UnusedPrivateFunction:
    # Previews are private (Compose rule PreviewPublic) and only called by tooling.
    ignoreAnnotated: ['Preview', 'AdaptivePreviews']

Compose:
  CompositionLocalAllowlist:
    # Theme tokens Material 3 has no slot for (common/ui/theme/ExtendedColorScheme.kt).
    allowedCompositionLocals: LocalExtendedColorScheme
  PreviewAnnotationNaming:
    # The rule wants a `Preview` prefix; the skills name the shared multipreview `@AdaptivePreviews`.
    active: false
